#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
#org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx4g

#org.gradle.configuration-cache=true
#org.gradle.caching=true
kotlin.native.cacheKind=none
kotlin.native.cacheKind.iosArm64=none
kotlin.native.cacheKind.iosSimulatorArm64=none

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

kotlin.native.cocoapods.generate.wrapper=true
kotlin.native.cocoapods.wrapper.path=/opt/homebrew/bin/pod
kotlin.mpp.enableCInteropCommonization=true
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true